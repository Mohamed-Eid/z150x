name: Build and test
# Checks only: every push and pull request is compiled, unit-tested and linted.
# Releases are NOT built here. The Z150X signing key never leaves the maintainer's machine; a
# release APK / Play bundle is built locally (see README → Build) so that it is always signed with
# the real key and never published with a debug one.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'z150x-**', 'feature/**']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testGithubDebugUnitTest --console=plain
      - name: Lint
        run: ./gradlew :app:lintGithubDebug --console=plain
      - name: Debug APK (sideload flavor) and Play flavor compile
        run: ./gradlew :app:assembleGithubDebug :app:assemblePlayDebug -PversionSuffix="-ci.${GITHUB_RUN_NUMBER}" --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Z150X-debug-${{ github.run_number }}
          path: app/build/outputs/apk/github/debug/*.apk
          retention-days: 14
